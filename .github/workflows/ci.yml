name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  # Fast, host-independent checks — no Xcode required.
  validate-samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate sample library
        run: python3 Scripts/validate_samples.py

  # Build the app and run the unit tests in the iOS Simulator.
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Build & test
        run: |
          xcodebuild test \
            -project OmnisphereSynth.xcodeproj \
            -scheme SuperNovaPad \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO
